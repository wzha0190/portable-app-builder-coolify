<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Portable App Builder reference validation</title>
  <desc id="desc">A sanitized summary showing seven passed validation groups for the GitHub and Coolify workflow.</desc>
  <rect width="1080" height="620" rx="24" fill="#0d1117"/>
  <text x="60" y="72" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Reference validation</text>
  <text x="60" y="108" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="18">Sanitized results from the post-restart workflow checks</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="20">
    <g transform="translate(60 150)"><rect width="460" height="82" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="38" cy="41" r="16" fill="#238636"/><path d="M30 41l6 6 12-14" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="35" fill="#f0f6fc" font-weight="600">GitHub access</text><text x="72" y="61" fill="#8b949e" font-size="16">Identity, owner policy and HTTPS Git</text></g>
    <g transform="translate(560 150)"><rect width="460" height="82" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="38" cy="41" r="16" fill="#238636"/><path d="M30 41l6 6 12-14" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="35" fill="#f0f6fc" font-weight="600">Coolify context</text><text x="72" y="61" fill="#8b949e" font-size="16">Authentication and resource inventory</text></g>
    <g transform="translate(60 252)"><rect width="460" height="82" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="38" cy="41" r="16" fill="#238636"/><path d="M30 41l6 6 12-14" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="35" fill="#f0f6fc" font-weight="600">Authorization probes</text><text x="72" y="61" fill="#8b949e" font-size="16">Write, deploy and log paths verified</text></g>
    <g transform="translate(560 252)"><rect width="460" height="82" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="38" cy="41" r="16" fill="#238636"/><path d="M30 41l6 6 12-14" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="35" fill="#f0f6fc" font-weight="600">Server readiness</text><text x="72" y="61" fill="#8b949e" font-size="16">Reachable and usable after polling</text></g>
    <g transform="translate(60 354)"><rect width="460" height="82" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="38" cy="41" r="16" fill="#238636"/><path d="M30 41l6 6 12-14" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="35" fill="#f0f6fc" font-weight="600">LAN routing</text><text x="72" y="61" fill="#8b949e" font-size="16">Wildcard DNS and reverse proxy</text></g>
    <g transform="translate(560 354)"><rect width="460" height="82" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="38" cy="41" r="16" fill="#238636"/><path d="M30 41l6 6 12-14" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="35" fill="#f0f6fc" font-weight="600">Shared AI metadata</text><text x="72" y="61" fill="#8b949e" font-size="16">Required entries present; key locked</text></g>
    <g transform="translate(60 456)"><rect width="960" height="82" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="38" cy="41" r="16" fill="#238636"/><path d="M30 41l6 6 12-14" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="35" fill="#f0f6fc" font-weight="600">Canary deployment</text><text x="72" y="61" fill="#8b949e" font-size="16">Running, healthy and externally reachable through the application hostname</text></g>
  </g>
  <text x="60" y="582" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="15">No credentials, private addresses, hostnames or resource identifiers are shown.</text>
</svg>
